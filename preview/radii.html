<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Corner Radii" subtitle="4 / 6 / 8px + toggle pill" viewport="700x165" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .card { padding: 22px 26px; font-family: var(--font-sans); display: flex; gap: 20px; }
  .sw { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--surface); border: 1px solid var(--border); }
  .nm { font: var(--weight-demibold) 12px var(--font-sans); color: var(--text); margin-top: 9px; }
  .px { font: 11px var(--font-mono); color: var(--text-muted); margin-top: 1px; }
  .use { font: 11px var(--font-sans); color: var(--text-muted); margin-top: 1px; }
</style>
  <link rel="stylesheet" href="specimen-shell.css" />
</head>
<body>
  <div class="card">
    <div class="sw"><div class="box" style="border-radius:4px"></div><div class="nm">4px</div><div class="use">icon btn · tab · check</div></div>
    <div class="sw"><div class="box" style="border-radius:6px"></div><div class="nm">6px</div><div class="use">input · display</div></div>
    <div class="sw"><div class="box" style="border-radius:8px"></div><div class="nm">8px</div><div class="use">button · menu · combo</div></div>
    <div class="sw"><div class="box" style="border-radius:10px;width:56px;height:28px;border-radius:14px"></div><div class="nm">pill</div><div class="use">toggle 40×20</div></div>
  </div>
  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body>
</html>

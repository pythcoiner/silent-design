<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Silent — Catalog</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<script>
  (function(){ try { document.documentElement.setAttribute('data-theme', localStorage.getItem('silent-ds-theme') || 'light'); } catch(e){} })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans);
    transition: background .2s, color .2s; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 32px 90px; }

  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .back { display: inline-flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 13px;
    padding: 7px 13px; border: 1px solid var(--border); border-radius: 999px; transition: border-color .15s, color .15s; }
  .back:hover { border-color: var(--accent); color: var(--text); }
  .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-secondary); border-radius: 999px; padding: 7px 14px;
    font: 500 13px var(--font-sans); cursor: pointer; transition: border-color .15s, color .15s; }
  .toggle:hover { border-color: var(--accent); color: var(--text); }
  .toggle .ic { width: 15px; height: 15px; display: inline-flex; }

  .eyebrow { font: 600 11px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 700 30px var(--font-sans); letter-spacing: -0.02em; margin: 8px 0 4px; }
  .desc { color: var(--text-secondary); font-size: 15px; margin: 0 0 34px; }

  .blocks { display: flex; flex-direction: column; gap: 14px; }
  a.block { display: flex; align-items: center; justify-content: space-between; gap: 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
    transition: border-color .15s, transform .15s, box-shadow .15s; }
  a.block:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.07); }
  .block .meta { min-width: 0; }
  .block .lbl { font: 600 16px var(--font-sans); }
  .block .fns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .block .fns code { font: 12px var(--font-mono); color: var(--accent); background: var(--bg-secondary);
    border: 1px solid var(--border-light); border-radius: 6px; padding: 2px 8px; }
  .block .go { flex: none; font: 600 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .missing { color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="index.html">← Catalog</a>
    <button class="toggle" id="themeToggle" aria-label="Toggle theme"><span class="ic" id="themeIcon"></span><span id="themeLabel">Light</span></button>
  </div>

  <div class="eyebrow">Silent · Catalog</div>
  <h1 id="title">Catalog</h1>
  <p class="desc" id="desc"></p>

  <div class="blocks" id="blocks"></div>
</div>

<script src="catalog-data.js"></script>
<script>
  const slug = window.CATALOG_SLUG;
  const want = new URLSearchParams(location.search).get('g') || '';
  const group = window.CATALOG_GROUPS.find(([name]) => slug(name) === want);
  const blocks = document.getElementById('blocks');

  if (!group) {
    document.getElementById('title').textContent = 'Not found';
    blocks.innerHTML = '<p class="missing">No such category. <a href="index.html">Back to catalog</a>.</p>';
  } else {
    const [name, desc, items] = group;
    document.getElementById('title').textContent = name;
    document.getElementById('desc').textContent = desc;
    document.title = 'Silent — ' + name;
    for (const [file, label, span, fns] of items) {
      const a = document.createElement('a');
      a.className = 'block';
      a.href = file + '.html?g=' + slug(name);
      const chips = (fns && fns.length) ? `<div class="fns">${fns.map(f => `<code>${f}</code>`).join('')}</div>` : '';
      a.innerHTML = `<div class="meta"><div class="lbl"></div>${chips}</div><span class="go">View →</span>`;
      a.querySelector('.lbl').textContent = label;
      blocks.appendChild(a);
    }
  }

  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const r = document.documentElement, ti = document.getElementById('themeIcon'), tl = document.getElementById('themeLabel');
  function apply(t){ r.setAttribute('data-theme', t); try { localStorage.setItem('silent-ds-theme', t); } catch(e){}
    ti.innerHTML = t === 'dark' ? MOON : SUN; tl.textContent = t === 'dark' ? 'Dark' : 'Light'; }
  apply(r.getAttribute('data-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => apply(r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>

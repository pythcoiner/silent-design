<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Amount" subtitle="Bitcoin amount: mono number + unit, optional sign · coin count · tone" viewport="760x260" -->
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="../components.css" /><style>html,body{margin:0;background:var(--bg);}.wrap{padding:24px 26px;font-family:var(--font-sans);}
.lead{font:10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.box{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;}
.grid{display:flex;flex-direction:column;gap:18px;}
.line{display:flex;align-items:baseline;gap:16px;}
.tag{flex:none;width:90px;font:11px var(--font-mono);color:var(--text-muted);}
.amt{display:inline-flex;align-items:baseline;gap:6px;}
.n{font-family:var(--font-mono);font-weight:600;color:var(--text);line-height:1;}
.u{font-family:var(--font-mono);color:var(--text-muted);}
.c{font:12px var(--font-sans);color:var(--text-secondary);margin-left:2px;}
</style>  <link rel="stylesheet" href="specimen-shell.css" />
</head><body><div class="wrap"><div class="grid">
  <div class="line"><span class="tag">hero</span><span class="amt"><span class="n" style="font-size:30px;letter-spacing:-.015em">0.04827310</span><span class="u" style="font-size:15px">BTC</span><span class="c">(4 coins)</span></span></div>
  <div class="line"><span class="tag">lg</span><span class="amt"><span class="n" style="font-size:19px">0.01500000</span><span class="u" style="font-size:11px">BTC</span></span></div>
  <div class="line"><span class="tag">md</span><span class="amt"><span class="n" style="font-size:15px">0.00327310</span><span class="u" style="font-size:11px">BTC</span></span></div>
  <div class="line"><span class="tag">sm · sign</span><span class="amt"><span class="n" style="font-size:13px;color:var(--warning)">+0.00051200</span><span class="u" style="font-size:11px">BTC</span></span></div>
</div></div>  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body></html>

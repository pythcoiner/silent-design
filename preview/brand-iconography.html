<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Iconography" subtitle="Lucide line icons · stroke 2 · currentColor" viewport="700x215" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .card { padding: 22px 26px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 16px 8px; }
  .ic { text-align: center; color: var(--text); }
  .gl { width: 24px; height: 24px; margin: 0 auto; background: currentColor;
        -webkit-mask-position: center; mask-position: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .nm { font: 9px var(--font-mono); color: var(--text-muted); margin-top: 6px; }
  .lead { font: 11px var(--font-mono); color: var(--text-muted); margin-bottom: 16px; }
</style>
  <link rel="stylesheet" href="specimen-shell.css" />
</head>
<body>
  <div class="card">
    <div class="lead">Lucide · stroke-only · width 2 · 24px · currentColor</div>
    <div class="grid" id="g"></div>
  </div>
  <script>
    const icons = ['history','coins','upload','download','settings','trash_2','pencil','x','chevron_down','copy','bitcoin','shield','check','plus','lock_open','eye_off','wallet','server','network','chevron_left'];
    document.getElementById('g').innerHTML = icons.map(n =>
      `<div class="ic"><div class="gl" style="-webkit-mask-image:url(../assets/icons/${n}.svg);mask-image:url(../assets/icons/${n}.svg)"></div><div class="nm">${n.replace(/_/g,'-')}</div></div>`
    ).join('');
  </script>
  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body>
</html>

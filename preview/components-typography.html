<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Text variants" subtitle="One Text primitive (theme::Label); variant selects a FontPalette role" viewport="760x420" -->
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="../components.css" /><style>html,body{margin:0;background:var(--bg);}.wrap{padding:24px 26px;font-family:var(--font-sans);}
.lead{font:10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.box{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;}
.grid{display:flex;flex-direction:column;gap:14px;}
.line{display:flex;align-items:baseline;gap:16px;white-space:nowrap;}
.tag{flex:none;width:120px;font:11px var(--font-mono);color:var(--text-muted);}
</style>  <link rel="stylesheet" href="specimen-shell.css" />
</head><body><div class="wrap"><div class="grid">
  <div class="line"><span class="tag">title</span><span class="t-title">Send bitcoin</span></div>
  <div class="line"><span class="tag">heading</span><span class="t-heading">Transaction</span></div>
  <div class="line"><span class="tag">subheading</span><span class="t-subheading">Coin selection</span></div>
  <div class="line"><span class="tag">section</span><span class="t-section">Payments</span></div>
  <div class="line"><span class="tag">body</span><span class="t-body">Standard paragraph copy and field values.</span></div>
  <div class="line"><span class="tag">secondary</span><span class="t-info-label">Muted supporting label</span></div>
  <div class="line"><span class="tag">caption / status</span><span class="t-caption">Connected to node</span></div>
  <div class="line"><span class="tag">mono</span><span class="t-mono">bc1q…xyz · 0.0482</span></div>
  <div class="line"><span class="tag">eyebrow (caps)</span><span class="t-mono" style="font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">Silent payment address</span></div>
</div></div>  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body></html>

<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Layout Metrics" subtitle="200px sidebar · 30px status bar · 1024×768 window" viewport="700x185" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .card { padding: 20px 26px; font-family: var(--font-sans); }
  .frame { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; height: 110px; background: var(--surface); }
  .side { width: 200px; background: var(--bg-secondary); border-right: 1px solid var(--border); position: relative; flex: none; }
  .side::after { content: "sidebar · 200px"; position: absolute; bottom: 6px; left: 8px; font: 10px var(--font-mono); color: var(--text-muted); }
  .main { flex: 1; position: relative; }
  .main::after { content: "screen"; position: absolute; top: 6px; left: 8px; font: 10px var(--font-mono); color: var(--text-muted); }
  .status { position: absolute; bottom: 0; left: 0; right: 0; height: 22px; background: var(--bg-secondary); border-top: 1px solid var(--border); }
  .status::after { content: "status bar · 30px"; position: absolute; top: 5px; left: 8px; font: 10px var(--font-mono); color: var(--text-muted); }
  .cap { font: 11px var(--font-mono); color: var(--text-muted); margin-top: 10px; }
</style>
  <link rel="stylesheet" href="specimen-shell.css" />
</head>
<body>
  <div class="card">
    <div class="frame">
      <div class="side"></div>
      <div class="main"><div class="status"></div></div>
    </div>
    <div class="cap">window 1024×768 · fixed 200px sidebar + 30px status bar · scrolling center pane</div>
  </div>
  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- @dsCard group="Generic Components" name="Generic — Modal & Status" subtitle="Dialog shell (height auto · wizard) + ModalStatus: spinner / icon · title · subtitle; the sent modal" viewport="900x340" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="../components.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .wrap { padding: 26px; font-family: var(--font-sans); display: flex; justify-content: center; align-items: flex-start; gap: 26px; flex-wrap: wrap; }
  .modal { width: 380px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px; box-sizing: border-box; }
  .mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .mtitle { font: var(--weight-demibold) var(--size-h3) var(--font-sans); color: var(--text); }
  .status { display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 14px 0 8px; }
  .spin { color: var(--accent); display: inline-flex; animation: s-spin 1s linear infinite; }
  @keyframes s-spin { to { transform: rotate(360deg); } }
  .stitle { font: 500 15px var(--font-sans); color: var(--text); }
  .ssub { font: 13px var(--font-sans); color: var(--text-muted); text-align: center; max-width: 280px; line-height: 1.6; }
  .ok { color: var(--success); display: inline-flex; }
  /* the sent modal: the txid chunked in groups of 4 (alternating dim), wrapping, copy on the right */
  .txid-card { display: flex; align-items: center; gap: var(--space-xs); margin-top: 15px; }
  .txid { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.4em; font: var(--size-body)/1.75 var(--font-mono); color: var(--text); }
  .txid span:nth-child(even) { color: var(--text-muted); }
</style>
  <link rel="stylesheet" href="specimen-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="modal">
      <div class="mhead">
        <span class="mtitle">Ledger Nano S Plus</span>
        <button class="s-btn s-btn--inline-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="status">
        <span class="spin"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></span>
        <div class="stitle">Confirm on your device…</div>
        <div class="ssub">Review the transaction details and approve to sign.</div>
      </div>
    </div>
    <div class="modal">
      <div class="mhead">
        <span class="mtitle">Transaction Sent</span>
        <button class="s-btn s-btn--inline-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="status">
        <span class="ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
        <div class="stitle">The transaction was broadcast.</div>
      </div>
    </div>
    <div class="modal" style="height:320px;display:flex;flex-direction:column">
      <div class="mhead"><span class="mtitle">height="wizard"</span></div>
      <div class="t-caption" style="color:var(--text-muted)">Fixed --modal-wizard-h (640px, shown at half scale): every wizard step keeps one size; the body fills it.</div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:10px;justify-content:space-between"><button class="s-btn s-btn--w-m">Back</button><button class="s-btn s-btn--primary s-btn--w-m">Continue</button></div>
    </div>
  </div>
  <script src="catalog-data.js"></script>
  <script src="specimen-shell.js"></script>
</body>
</html>

<body>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Icons.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Primitives.jsx?v=27"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Layout.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Widgets.jsx?v=10"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Variants.jsx?v=35"></script>

  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Address.jsx?v=9"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Data.jsx?v=12"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/ScreensBasic.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/TxFlow.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Send.jsx?v=41"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Settings.jsx?v=12"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs">
    const W = WALLETS[KNOWN_WALLETS[0]] || Object.values(WALLETS)[0];

    function TestableRowDemo() {
      const [v, setV] = React.useState(W.blindbit);
      return <TestableRow label="BlindBit URL:" value={v} onChange={setV} placeholder="https://…" />;
    }
    function NetworkDemo() {
      const [net, setNet] = React.useState(W.network);
      return (
        <Field label="Network:" labelWidth={80}>
          <ComboBox value={net} options={NETWORKS} onChange={setNet} width={200} />
        </Field>
      );
    }

    Gallery.render({
      kicker: 'Settings · components', title: 'Settings panel',
      lede: 'Backend endpoints (each with a Test button), the network selector, and read-only backend info.',
      groups: [
        { name: 'Screen', items: [
          { title: 'Settings — full screen', tag: 'SettingsScreen', span: 'full', frame: true, height: 560, el: <SettingsScreen wallet={W} /> },
        ]},
        { name: 'Building blocks', items: [
          { title: 'Testable endpoint row', tag: 'TestableRow', span: 'span2', el: <div style={{ padding: 4 }}><TestableRowDemo /></div> },
          { title: 'Network selector', tag: 'ComboBox', span: 'span2', el: <div style={{ padding: 4 }}><NetworkDemo /></div> },
        ]},
      ],
    });
  </script>
</body>

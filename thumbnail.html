<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:flex}.main{flex:0 0 960px;height:854px;background:var(--blue-dark);display:flex;align-items:center;justify-content:center;gap:48px;color:var(--white)}.main img{width:150px;height:150px;filter:brightness(0) invert(1)}.main span{font:600 150px/1 var(--font-sans);letter-spacing:-0.02em;white-space:nowrap}.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><img src="assets/logo-mark.svg" alt=""><span>Silent</span></div><div class="strip"><div style="background:var(--yellow)"></div><div style="background:var(--green)"></div><div style="background:var(--red)"></div><div style="background:var(--green-dark)"></div></div></body></html>
